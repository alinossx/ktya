<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Red Means I Love You</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .page-gothic {
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }
    
    .gothic-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      box-sizing: border-box;
    }
    
    .lyrics-box {
      min-height: 180px;
      max-height: 42vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      width: 100%;
      max-width: 640px;
      margin-bottom: 16px;
    }
    
    .lyric-line {
      font-size: clamp(1rem, 3.8vw, 1.4rem);
      margin: 6px 0;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.55s ease;
      line-height: 1.4;
    }
    
    .lyric-line.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .lyric-line.fading {
      opacity: 0;
      transform: translateY(-10px);
    }
    
    .lyric-line.chorus {
      color: #ff6b8a;
      font-weight: 600;
      font-size: clamp(1.1rem, 4.2vw, 1.55rem);
    }
    
    .translation {
      font-size: 0.78rem;
      color: rgba(200, 160, 170, 0.55);
      margin-top: 3px;
      font-style: italic;
      opacity: 0;
      transition: opacity 0.45s ease;
    }
    
    .translation.visible {
      opacity: 1;
    }
    
    .skip-btn {
      margin-top: 12px;
      padding: 10px 28px;
      font-size: 0.95rem;
      background: rgba(180, 40, 70, 0.35);
      border: 1px solid rgba(255, 100, 130, 0.4);
      color: #ffb0c0;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .skip-btn:hover {
      background: rgba(200, 50, 80, 0.55);
      color: #fff;
    }
    
    .rose-container {
      margin-top: 10px;
    }
    
    .audio-note {
      font-size: 0.75rem;
      margin-top: 12px;
      opacity: 0.5;
    }
    
    .song-title {
      margin-bottom: 18px;
      font-size: 1.35rem;
    }
  </style>
</head>
<body class="page-gothic">
  <div class="gothic-content">
    <div class="song-title">The Red Means I Love You</div>
    
    <div class="lyrics-box" id="lyricsBox">
      <!-- текущие строки будут здесь -->
    </div>

    <button class="skip-btn" id="skipBtn">Пропустить →</button>

    <div class="rose-container" id="roseContainer">
      <div class="rose" id="rose" title="Забрать розу">🌹</div>
      <div class="rose-hint">Нажми, чтобы забрать розу</div>
    </div>

    <a href="letters.html" class="btn btn-next" id="nextBtn" style="display:none; margin-top:20px;">Дальше →</a>
    
    <p class="audio-note">Положи файл <b>music.mp3</b> рядом с сайтом, чтобы заиграла песня</p>
  </div>

  <audio id="song" preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const lyrics = [
      { en: "Unusual", ru: "Необычная", chorus: false },
      { en: "They say strange fascination, infatuation", ru: "Говорят — странное увлечение, влюблённость", chorus: false },
      { en: "A lunatic", ru: "Лунатик", chorus: false },
      { en: "Call me what suits your taste, I just wanna taste", ru: "Называй как хочешь, я просто хочу попробовать", chorus: false },
      { en: "And I've always heard it's what's inside that counts", ru: "И я всегда слышала, что важно то, что внутри", chorus: false },
      { en: "Cause my insides are red, and yours are too", ru: "Потому что моё нутро красное, и твоё тоже", chorus: false },
      { en: "And the red on my face is matching you", ru: "И красное на моём лице совпадает с тобой", chorus: false },
      { en: "And goodness, you're bleeding, what a wonderful feeling", ru: "Боже, ты истекаешь кровью — какое чудесное чувство", chorus: false },
      { en: "You're down, and you're pleading, my head is just reeling", ru: "Ты упал и умоляешь, а у меня кружится голова", chorus: false },
      { en: "The red means I love you", ru: "Красное значит — я люблю тебя", chorus: true },
      { en: "Tasting your blood means I love you", ru: "Вкус твоей крови значит — я люблю тебя", chorus: true },
      { en: "The red means I love you", ru: "Красное значит — я люблю тебя", chorus: true },
      { en: "The red means I love you", ru: "Красное значит — я люблю тебя", chorus: true },
      { en: "Unfortunate", ru: "Несчастная", chorus: false },
      { en: "They say such a shame, I turned out this way", ru: "Говорят — какая жалость, что я стала такой", chorus: false },
      { en: "A maniac", ru: "Маньячка", chorus: false },
      { en: "Well, yeah, I get manic when I cause a panic", ru: "Ну да, я впадаю в манию, когда вызываю панику", chorus: false },
      { en: "And of course I'm excited when I see you around", ru: "И конечно я взволнована, когда вижу тебя рядом", chorus: false },
      { en: "You leave me high and dry", ru: "Ты оставляешь меня на произвол судьбы", chorus: false },
      { en: "A rush comes to my mind", ru: "Волна накрывает мой разум", chorus: false },
      { en: "At the drops of blood you leave behind", ru: "От капель крови, что ты оставляешь", chorus: false },
      { en: "Run as you might, my love will never, ever stop", ru: "Беги сколько хочешь — моя любовь никогда не остановится", chorus: false },
    ];

    const box = document.getElementById('lyricsBox');
    const roseContainer = document.getElementById('roseContainer');
    const rose = document.getElementById('rose');
    const nextBtn = document.getElementById('nextBtn');
    const skipBtn = document.getElementById('skipBtn');
    const audio = document.getElementById('song');

    let currentIndex = 0;
    let songStarted = false;
    let finished = false;
    let timer = null;

    const MAX_VISIBLE = 4;

    function createLineElement(line) {
      const div = document.createElement('div');
      div.className = 'lyric-line' + (line.chorus ? ' chorus' : '');
      div.innerHTML = line.en + '<div class="translation">' + line.ru + '</div>';
      return div;
    }

    function showNextLine() {
      if (finished || currentIndex >= lyrics.length) {
        finishSong();
        return;
      }

      const lineData = lyrics[currentIndex];
      const el = createLineElement(lineData);
      box.appendChild(el);

      requestAnimationFrame(() => {
        el.classList.add('visible');
        setTimeout(() => {
          const tr = el.querySelector('.translation');
          if (tr) tr.classList.add('visible');
        }, 250);
      });

      const lines = box.querySelectorAll('.lyric-line');
      if (lines.length > MAX_VISIBLE) {
        const old = lines[0];
        old.classList.add('fading');
        setTimeout(() => old.remove(), 500);
      }

      currentIndex++;

      const delay = currentIndex < 10 ? 2600 : (currentIndex < 18 ? 3000 : 3400);
      timer = setTimeout(showNextLine, delay);
    }

    function finishSong() {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      
      const lines = box.querySelectorAll('.lyric-line');
      lines.forEach((l, i) => {
        setTimeout(() => {
          l.classList.add('fading');
          setTimeout(() => l.remove(), 450);
        }, i * 80);
      });

      setTimeout(() => {
        roseContainer.classList.add('show');
        skipBtn.style.display = 'none';
      }, 700);
    }

    function startExperience() {
      if (songStarted) return;
      songStarted = true;
      
      audio.play().catch(() => {});
      setTimeout(showNextLine, 600);
    }

    skipBtn.addEventListener('click', () => {
      audio.pause();
      finishSong();
    });

    window.addEventListener('load', () => {
      setTimeout(startExperience, 500);
    });
    
    document.body.addEventListener('click', startExperience, { once: true });
    document.body.addEventListener('touchstart', startExperience, { once: true });

    audio.addEventListener('ended', finishSong);

    setTimeout(() => {
      if (!finished) finishSong();
    }, 90000);

    rose.addEventListener('click', () => {
      rose.classList.add('taken');
      setTimeout(() => {
        nextBtn.style.display = 'inline-block';
      }, 550);
    });
  </script>
</body>
</html>
